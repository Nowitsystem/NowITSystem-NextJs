<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#F7F5FF"/>
  <defs>
    <filter id="appShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#4832C8" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="appPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8471FF"/>
      <stop offset="100%" stop-color="#5840E6"/>
    </linearGradient>
    <linearGradient id="appMint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1EC8AE"/>
      <stop offset="100%" stop-color="#0D9A86"/>
    </linearGradient>
  </defs>

  <g transform="translate(400 300) rotate(-28) skewX(24) scale(1 0.86)">
    <!-- Central Low-Code Visual Builder Canvas -->
    <g filter="url(#appShadow)">
      <rect x="-145" y="-122" width="290" height="232" rx="18" fill="#FFFFFF"/>
      <path d="M-145 -104C-145 -113.9 -136.9 -122 -127 -122H127C136.9 -122 145 -113.9 145 -104V-86H-145V-104Z" fill="#17132E"/>
      <circle cx="-125" cy="-104" r="4" fill="#6954F5"/>
      <circle cx="-111" cy="-104" r="4" fill="#0D9A86"/>
      <rect x="68" y="-111" width="58" height="14" rx="7" fill="url(#appMint)"/>

      <!-- Canvas Grid Backdrop -->
      <rect x="-126" y="-68" width="252" height="156" rx="12" fill="#FAF9FF" stroke="#E9E4FC"/>

      <!-- Workflow Nodes + Connectors -->
      <path d="M-40 -26H20C32 -26 32 10 44 10H58" stroke="#6954F5" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M-40 -26H-8C6 -26 6 44 20 44H42" stroke="#0D9A86" stroke-width="2.5" stroke-linecap="round" fill="none"/>

      <!-- Node 1: Trigger -->
      <rect x="-106" y="-48" width="76" height="44" rx="12" fill="#FFFFFF" stroke="#DED7FB"/>
      <circle cx="-86" cy="-26" r="10" fill="url(#appPurple)"/>
      <rect x="-68" y="-31" width="28" height="6" rx="3" fill="#17132E"/>
      <rect x="-68" y="-21" width="20" height="4" rx="2" fill="#C4BCE4"/>

      <!-- Node 2: Logic -->
      <rect x="28" y="-12" width="80" height="44" rx="12" fill="#FFFFFF" stroke="#DED7FB"/>
      <rect x="40" y="0" width="20" height="20" rx="6" fill="#EAE6FE"/>
      <rect x="66" y="4" width="32" height="6" rx="3" fill="#17132E"/>
      <rect x="66" y="14" width="22" height="4" rx="2" fill="#C4BCE4"/>

      <!-- Node 3: Deploy -->
      <rect x="28" y="34" width="80" height="42" rx="12" fill="#FFFFFF" stroke="#CDEEE8"/>
      <circle cx="48" cy="55" r="10" fill="url(#appMint)"/>
      <path d="M44 55l3 3 5-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="66" y="50" width="32" height="6" rx="3" fill="#17132E"/>
      <rect x="66" y="60" width="24" height="4" rx="2" fill="#9BDCD0"/>
    </g>

    <!-- Left Foreground Card: Form Designer -->
    <g filter="url(#appShadow)" transform="translate(-142 78)">
      <rect x="-98" y="-58" width="196" height="122" rx="16" fill="#FFFFFF" stroke="#ECE8FC"/>
      <rect x="-78" y="-40" width="90" height="8" rx="4" fill="#17132E"/>
      <rect x="-78" y="-20" width="156" height="18" rx="6" fill="#F5F3FF" stroke="#E0DAFB"/>
      <rect x="-78" y="6" width="156" height="18" rx="6" fill="#F5F3FF" stroke="#E0DAFB"/>
      <rect x="-78" y="34" width="86" height="18" rx="9" fill="url(#appPurple)"/>
      <rect x="20" y="34" width="58" height="18" rx="9" fill="#EBFBF7"/>
    </g>

    <!-- Right Floating Card: Component Blocks -->
    <g filter="url(#appShadow)" transform="translate(152 -66)">
      <rect x="-82" y="-50" width="164" height="106" rx="16" fill="#FFFFFF" stroke="#ECE8FC"/>
      <rect x="-64" y="-34" width="56" height="30" rx="8" fill="#F5F3FF" stroke="#E0DAFB"/>
      <rect x="6" y="-34" width="56" height="30" rx="8" fill="#EBFBF7" stroke="#CDEEE8"/>
      <rect x="-64" y="6" width="56" height="30" rx="8" fill="#17132E"/>
      <rect x="6" y="6" width="56" height="30" rx="8" fill="url(#appPurple)"/>
    </g>
  </g>
</svg>
