<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#F7F5FF"/>
  <defs>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#4832C8" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8471FF"/>
      <stop offset="100%" stop-color="#5840E6"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1EC8AE"/>
      <stop offset="100%" stop-color="#0D9A86"/>
    </linearGradient>
  </defs>

  <!-- Subtle connector frame -->
  <g transform="translate(400 300) rotate(-28) skewX(24) scale(1 0.86)">
    <rect x="-200" y="-150" width="400" height="300" rx="22" stroke="#D9D2FA" stroke-width="1.5" fill="none"/>

    <!-- Central Employee Center Portal -->
    <g filter="url(#cardShadow)">
      <rect x="-135" y="-120" width="275" height="230" rx="18" fill="#FFFFFF"/>
      <path d="M-135 -102C-135 -111.9 -126.9 -120 -117 -120H122C131.9 -120 140 -111.9 140 -102V-84H-135V-102Z" fill="#17132E"/>
      <circle cx="-116" cy="-102" r="4" fill="#6954F5"/>
      <circle cx="-102" cy="-102" r="4" fill="#0D9A86"/>
      <circle cx="-88" cy="-102" r="4" fill="#A59BE0"/>

      <!-- Portal Header & Search -->
      <rect x="-112" y="-68" width="150" height="12" rx="6" fill="#17132E"/>
      <rect x="-112" y="-44" width="228" height="24" rx="12" fill="#F2EFFC" stroke="#E0D9FA"/>
      <circle cx="96" cy="-32" r="6" stroke="#6954F5" stroke-width="2" fill="none"/>

      <!-- 4 HR Service Tiles -->
      <rect x="-112" y="-6" width="106" height="46" rx="12" fill="#FAF9FF" stroke="#E6E1FB"/>
      <rect x="-98" y="6" width="22" height="22" rx="7" fill="url(#purpleGrad)"/>
      <circle cx="-87" cy="14" r="3.5" fill="#fff"/>
      <path d="M-93 23c0-3 12-3 12 0" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <rect x="-66" y="10" width="46" height="6" rx="3" fill="#17132E"/>
      <rect x="-66" y="21" width="32" height="5" rx="2.5" fill="#C6C0E4"/>

      <rect x="10" y="-6" width="106" height="46" rx="12" fill="#FAF9FF" stroke="#E6E1FB"/>
      <rect x="24" y="6" width="22" height="22" rx="7" fill="url(#mintGrad)"/>
      <path d="M30 17l4 4 7-8" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="56" y="10" width="46" height="6" rx="3" fill="#17132E"/>
      <rect x="56" y="21" width="34" height="5" rx="2.5" fill="#C6C0E4"/>

      <rect x="-112" y="52" width="106" height="46" rx="12" fill="#FAF9FF" stroke="#E6E1FB"/>
      <rect x="-98" y="64" width="22" height="22" rx="7" fill="#E8E4FC"/>
      <rect x="-92" y="70" width="10" height="10" rx="2" fill="#6954F5"/>
      <rect x="-66" y="68" width="44" height="6" rx="3" fill="#17132E"/>
      <rect x="-66" y="79" width="30" height="5" rx="2.5" fill="#C6C0E4"/>

      <rect x="10" y="52" width="106" height="46" rx="12" fill="#FAF9FF" stroke="#E6E1FB"/>
      <rect x="24" y="64" width="22" height="22" rx="7" fill="#DCF6F1"/>
      <circle cx="35" cy="75" r="5" fill="#0D9A86"/>
      <rect x="56" y="68" width="44" height="6" rx="3" fill="#17132E"/>
      <rect x="56" y="79" width="36" height="5" rx="2.5" fill="#C6C0E4"/>
    </g>

    <!-- Left Foreground Card: Onboarding Journey -->
    <g filter="url(#cardShadow)" transform="translate(-145 78)">
      <rect x="-105" y="-56" width="210" height="122" rx="16" fill="#FFFFFF" stroke="#ECE8FC"/>
      <rect x="-86" y="-38" width="104" height="9" rx="4.5" fill="#17132E"/>
      <rect x="-86" y="-20" width="172" height="6" rx="3" fill="#ECE8FC"/>
      <rect x="-86" y="-20" width="128" height="6" rx="3" fill="url(#mintGrad)"/>

      <!-- Milestone Rows -->
      <circle cx="-76" cy="4" r="9" fill="#0D9A86"/>
      <path d="M-80 4l3 3 5-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-56" y="0" width="90" height="7" rx="3.5" fill="#2B264A"/>
      <rect x="46" y="-4" width="42" height="15" rx="7.5" fill="#DDF7F2"/>

      <circle cx="-76" cy="28" r="9" fill="#6954F5"/>
      <circle cx="-76" cy="28" r="3" fill="#fff"/>
      <rect x="-56" y="24" width="76" height="7" rx="3.5" fill="#2B264A"/>
      <rect x="46" y="20" width="42" height="15" rx="7.5" fill="#EAE6FE"/>

      <circle cx="-76" cy="50" r="7" stroke="#C9C2E8" stroke-width="2" fill="#fff"/>
      <rect x="-56" y="47" width="64" height="6" rx="3" fill="#B5AED6"/>
    </g>

    <!-- Right Floating Card: HR Virtual Agent -->
    <g filter="url(#cardShadow)" transform="translate(152 -66)">
      <rect x="-88" y="-54" width="176" height="112" rx="16" fill="#FFFFFF" stroke="#ECE8FC"/>
      <circle cx="-62" cy="-28" r="12" fill="url(#purpleGrad)"/>
      <path d="M-62 -34l1.8 4.2L-56 -28l-4.2 1.8L-62 -22l-1.8-4.2L-68 -28l4.2-1.8z" fill="#fff"/>
      <rect x="-42" y="-34" width="84" height="8" rx="4" fill="#17132E"/>
      <rect x="-42" y="-21" width="52" height="5" rx="2.5" fill="#B5AED6"/>

      <rect x="-68" y="-2" width="112" height="16" rx="8" fill="#F2EFFC"/>
      <rect x="-34" y="20" width="102" height="16" rx="8" fill="url(#mintGrad)"/>
      <rect x="-20" y="25" width="74" height="6" rx="3" fill="#fff" opacity="0.9"/>
    </g>
  </g>
</svg>
