<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#F7F5FF"/>
  <defs>
    <filter id="spmShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#4832C8" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="spmPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8471FF"/>
      <stop offset="100%" stop-color="#5840E6"/>
    </linearGradient>
    <linearGradient id="spmMint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1EC8AE"/>
      <stop offset="100%" stop-color="#0D9A86"/>
    </linearGradient>
  </defs>

  <g transform="translate(400 300) rotate(-28) skewX(24) scale(1 0.86)">
    <!-- Central Portfolio Roadmap Gantt -->
    <g filter="url(#spmShadow)">
      <rect x="-150" y="-120" width="300" height="225" rx="18" fill="#FFFFFF"/>
      <path d="M-150 -102C-150 -111.9 -141.9 -120 -132 -120H132C141.9 -120 150 -111.9 150 -102V-84H-150V-102Z" fill="#17132E"/>
      <circle cx="-130" cy="-102" r="4" fill="#6954F5"/>
      <circle cx="-116" cy="-102" r="4" fill="#0D9A86"/>
      <rect x="-126" y="-66" width="118" height="10" rx="5" fill="#17132E"/>
      <rect x="66" y="-68" width="58" height="16" rx="8" fill="#EAE6FE"/>

      <!-- Quarter Grid Lines -->
      <line x1="-68" y1="-40" x2="-68" y2="85" stroke="#EFEBFB" stroke-width="1.5"/>
      <line x1="-4" y1="-40" x2="-4" y2="85" stroke="#EFEBFB" stroke-width="1.5"/>
      <line x1="60" y1="-40" x2="60" y2="85" stroke="#EFEBFB" stroke-width="1.5"/>
      <line x1="124" y1="-40" x2="124" y2="85" stroke="#EFEBFB" stroke-width="1.5"/>

      <!-- Gantt Bars -->
      <rect x="-126" y="-32" width="44" height="7" rx="3.5" fill="#B5AED6"/>
      <rect x="-64" y="-36" width="128" height="15" rx="7.5" fill="url(#spmPurple)"/>

      <rect x="-126" y="-4" width="44" height="7" rx="3.5" fill="#B5AED6"/>
      <rect x="-24" y="-8" width="142" height="15" rx="7.5" fill="url(#spmMint)"/>

      <rect x="-126" y="24" width="44" height="7" rx="3.5" fill="#B5AED6"/>
      <rect x="-50" y="20" width="96" height="15" rx="7.5" fill="#17132E"/>

      <rect x="-126" y="52" width="44" height="7" rx="3.5" fill="#B5AED6"/>
      <rect x="14" y="48" width="104" height="15" rx="7.5" fill="#B9AEFF"/>
    </g>

    <!-- Left Foreground Card: Alignment & Investment -->
    <g filter="url(#spmShadow)" transform="translate(-142 82)">
      <rect x="-98" y="-58" width="196" height="118" rx="16" fill="#FFFFFF" stroke="#ECE8FC"/>
      <rect x="-78" y="-40" width="94" height="8" rx="4" fill="#17132E"/>
      <circle cx="-46" cy="8" r="24" stroke="#EAE6FE" stroke-width="8" fill="none"/>
      <circle cx="-46" cy="8" r="24" stroke="url(#spmMint)" stroke-width="8" stroke-dasharray="116 150" stroke-linecap="round" fill="none" transform="rotate(-90 -46 8)"/>
      <rect x="-4" y="-12" width="80" height="8" rx="4" fill="#6954F5"/>
      <rect x="-4" y="4" width="62" height="7" rx="3.5" fill="#D8D2F8"/>
      <rect x="-4" y="20" width="72" height="8" rx="4" fill="#0D9A86"/>
    </g>

    <!-- Right Floating Card: Agile Sprint Status -->
    <g filter="url(#spmShadow)" transform="translate(148 -68)">
      <rect x="-86" y="-52" width="172" height="112" rx="16" fill="#FFFFFF" stroke="#ECE8FC"/>
      <rect x="-68" y="-36" width="80" height="8" rx="4" fill="#17132E"/>
      <rect x="-68" y="-16" width="40" height="46" rx="8" fill="#F5F3FF"/>
      <rect x="-20" y="-16" width="40" height="46" rx="8" fill="#F5F3FF"/>
      <rect x="28" y="-16" width="40" height="46" rx="8" fill="#EBFBF7"/>
      <rect x="-62" y="-10" width="28" height="10" rx="4" fill="#6954F5"/>
      <rect x="-62" y="6" width="28" height="10" rx="4" fill="#C3B8FB"/>
      <rect x="-14" y="-10" width="28" height="10" rx="4" fill="#17132E"/>
      <rect x="34" y="-10" width="28" height="10" rx="4" fill="#0D9A86"/>
      <rect x="34" y="6" width="28" height="10" rx="4" fill="#0D9A86" opacity="0.65"/>
    </g>
  </g>
</svg>
